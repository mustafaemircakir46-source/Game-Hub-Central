kind = "web"
previewPath = "/"
title = "RUKİYE EKİNCİ - Oyun Platformu"
version = "1.0.0"
id = "artifacts/rukiye-ekinci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20140

[services.development]
run = "pnpm --filter @workspace/rukiye-ekinci run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rukiye-ekinci", "run", "build" ]
publicDir = "artifacts/rukiye-ekinci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20140"
BASE_PATH = "/"
