packages:
  "framer-motion": "For premium smooth animations, page transitions, and interactive gesture feedback"
  "zustand": "For lightweight, fast global state management (auth state, ui toggles)"
  "date-fns": "For formatting timestamps in posts, comments, and games"
  "lucide-react": "For beautiful, consistent iconography across the platform"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to efficiently merge Tailwind CSS classes"

images:
