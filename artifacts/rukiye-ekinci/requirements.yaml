    description: "Minimalist, sleek geometric gaming logo mark, neon purple and glowing deep blue gradient, dark background, premium Apple-like aesthetic"
    aspect_ratio: "1:1"
  - path: "artifacts/rukiye-ekinci/public/images/hero-bg.png"
    description: "Abstract premium dark glassmorphism background, deep black with subtle glowing neon purple and cyan volumetric lights, 3D modern elegant texture"
    aspect_ratio: "16:9"
  - path: "artifacts/rukiye-ekinci/public/images/ai-avatar.png"
    description: "Futuristic friendly AI assistant avatar, glowing holographic elements, dark sleek background, premium 3D render"
    aspect_ratio: "1:1"

notes:
  - "Assuming customFetch handles the localStorage token injection automatically, or API relies on httpOnly cookies for auth."
